<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>National Intellectual Property Office - Sri Lanka | Portal Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        nipo: { navy: '#0d1b2a', deepBlue: '#1a2b4c', gold: '#d4af37', bg: '#f4f6f9' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-nipo-bg font-sans min-h-screen flex flex-col justify-between antialiased">

    <!-- TOP BAR -->
    <div class="bg-nipo-navy text-slate-300 text-xs py-2 px-4 border-b border-slate-700">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <span><i class="fa-solid fa-building-columns mr-1.5 text-amber-400"></i> Democratic Socialist Republic of Sri Lanka</span>
            <span>NIPO Secure e-Filing Gateway</span>
        </div>
    </div>

    <!-- LOGIN CARD CONTAINER -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="bg-white p-8 rounded-2xl shadow-xl border border-slate-200 max-w-md w-full space-y-6">
            <div class="text-center space-y-2">
                <div class="w-14 h-14 rounded-full bg-nipo-deepBlue text-nipo-gold flex items-center justify-center text-2xl font-bold mx-auto shadow-md border-2 border-nipo-gold">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h1 class="text-xl font-bold text-nipo-deepBlue">NIPO Portal Sign In</h1>
                <p class="text-xs text-slate-500">Enter your credentials to access Form M-1 e-Filing.</p>
            </div>

            <!-- QUICK TEST LOGIN BUTTON (NO PASSWORD) -->
            <div class="p-4 bg-amber-50 rounded-xl border border-amber-300 text-center space-y-2">
                <span class="text-[11px] font-bold text-amber-900 block uppercase">Instant Evaluation Mode</span>
                <button type="button" onclick="testLoginNoPassword()" class="w-full py-2.5 px-4 bg-amber-600 hover:bg-amber-700 text-white rounded-xl text-xs font-bold transition shadow-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-bolt"></i> ⚡ Quick Test Login (Without Password)
                </button>
            </div>

            <div class="relative flex py-1 items-center">
                <div class="flex-grow border-t border-slate-200"></div>
                <span class="flex-shrink mx-4 text-slate-400 text-[11px] uppercase font-semibold">Or Sign In with Email</span>
                <div class="flex-grow border-t border-slate-200"></div>
            </div>

            <!-- LOGIN FORM -->
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Email Address *</label>
                    <input type="email" id="loginEmail" placeholder="e.g. kusal@example.lk" class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-nipo-deepBlue" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Password *</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-nipo-deepBlue" required>
                </div>
                <button type="submit" class="w-full py-3 bg-nipo-deepBlue text-white rounded-xl text-xs font-bold hover:bg-slate-800 transition shadow-md">
                    Sign In to Portal
                </button>
            </form>

            <div class="text-center pt-2 border-t border-slate-100">
                <p class="text-xs text-slate-600">
                    Don't have an account? 
                    <a href="register.html" class="text-nipo-deepBlue font-bold hover:underline">Create Account</a>
                </p>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-nipo-navy text-slate-400 text-center py-4 text-xs border-t border-slate-800">
        National Intellectual Property Office of Sri Lanka &copy; 2026
    </footer>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            if (!email || !password) {
                alert("Please enter both email and password.");
                return;
            }

            // Save session and redirect securely to application page
            const userData = { name: email.split('@')[0], email: email };
            localStorage.setItem('nipo_active_user', JSON.stringify(userData));
            window.location.href = 'index.html';
        }

        function testLoginNoPassword() {
            const testUser = { name: 'Test Examiner / Applicant', email: 'test.user@nipo.lk' };
            localStorage.setItem('nipo_active_user', JSON.stringify(testUser));
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
