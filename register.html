<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>National Intellectual Property Office - Sri Lanka | Create Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        nipo: { navy: '#0d1b2a', deepBlue: '#1a2b4c', gold: '#d4af37', bg: '#f4f6f9' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-nipo-bg font-sans min-h-screen flex flex-col justify-between antialiased">

    <div class="bg-nipo-navy text-slate-300 text-xs py-2 px-4 border-b border-slate-700">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <span><i class="fa-solid fa-building-columns mr-1.5 text-amber-400"></i> Democratic Socialist Republic of Sri Lanka</span>
            <span>NIPO Secure e-Filing Gateway</span>
        </div>
    </div>

    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="bg-white p-8 rounded-2xl shadow-xl border border-slate-200 max-w-md w-full space-y-6">
            <div class="text-center space-y-2">
                <div class="w-14 h-14 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center text-2xl font-bold mx-auto shadow-md border-2 border-emerald-500">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <h1 class="text-xl font-bold text-nipo-deepBlue">Create NIPO Account</h1>
                <p class="text-xs text-slate-500">Register a secure e-Filing account to submit Form M-1.</p>
            </div>

            <!-- REGISTRATION FORM -->
            <form onsubmit="handleRegister(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Full Name *</label>
                    <input type="text" id="regName" placeholder="e.g. Kusal Janith Perera" class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-emerald-600" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Email Address *</label>
                    <input type="email" id="regEmail" placeholder="e.g. kusal@example.lk" class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-emerald-600" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Create Password *</label>
                    <input type="password" id="regPassword" placeholder="••••••••" class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-emerald-600" required>
                </div>
                <button type="submit" class="w-full py-3 bg-emerald-600 text-white rounded-xl text-xs font-bold hover:bg-emerald-700 transition shadow-md">
                    Register & Continue to Portal
                </button>
            </form>

            <div class="text-center pt-2 border-t border-slate-100">
                <p class="text-xs text-slate-600">
                    Already have an account? 
                    <a href="login.html" class="text-nipo-deepBlue font-bold hover:underline">Sign In</a>
                </p>
            </div>
        </div>
    </main>

    <footer class="bg-nipo-navy text-slate-400 text-center py-4 text-xs border-t border-slate-800">
        National Intellectual Property Office of Sri Lanka &copy; 2026
    </footer>

    <script>
        function handleRegister(event) {
            event.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();

            if (!name || !email || !password) {
                alert("Please fill in all registration fields.");
                return;
            }

            // Save user session securely and redirect to application page
            const userData = { name, email };
            localStorage.setItem('nipo_active_user', JSON.stringify(userData));
            
            alert(`Account successfully created for ${name}! Redirecting to e-Filing portal.`);
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
