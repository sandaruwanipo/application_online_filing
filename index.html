<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trademark Class & Goods Finder</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --warning-bg: #fffbeeb;
      --warning-border: #fde68a;
      --warning-text: #b45309;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
      background: var(--card-bg);
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    h1 {
      margin-top: 0;
      color: #0f172a;
      font-size: 1.75rem;
    }

    .tabs {
      display: flex;
      gap: 12px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 24px;
    }

    .tab-btn {
      padding: 12px 20px;
      border: none;
      background: none;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      font-size: 1rem;
    }

    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input[type="text"], input[type="number"], textarea, select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
      box-sizing: border-box;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .results {
      margin-top: 20px;
    }

    .class-group {
      background: #f1f5f9;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .class-header {
      font-weight: bold;
      font-size: 1.1rem;
      color: #0f172a;
      margin-bottom: 10px;
    }

    .item-list {
      list-style-type: none;
      padding-left: 0;
      margin: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .item-tag {
      background: #ffffff;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 0.9rem;
    }

    .notice-box {
      background-color: var(--warning-bg);
      border: 1px solid var(--warning-border);
      color: var(--warning-text);
      padding: 12px 16px;
      border-radius: 8px;
      margin-top: 12px;
      font-size: 0.95rem;
    }

    button.btn-submit {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }

    button.btn-submit:hover {
      background-color: var(--primary-hover);
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Trademark Class & Goods Finder</h1>

  <!-- Navigation Tabs -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('class-search')">Search by Class Number</button>
    <button class="tab-btn" onclick="switchTab('keyword-search')">Search by Keyword</button>
    <button class="tab-btn" onclick="switchTab('custom-item')">Submit Custom Terms</button>
  </div>

  <!-- TAB 1: Search by Class Number -->
  <div id="class-search" class="tab-content active">
    <div class="form-group">
      <label for="classNumber">Select or Enter Class Number (1–45):</label>
      <input type="number" id="classNumber" min="1" max="45" placeholder="e.g. 9" oninput="searchByClass()">
    </div>
    <div id="classResults" class="results"></div>
  </div>

  <!-- TAB 2: Search by Keyword -->
  <div id="keyword-search" class="tab-content">
    <div class="form-group">
      <label for="keywordInput">Enter Goods / Services Keyword:</label>
      <input type="text" id="keywordInput" placeholder="e.g. software, tea, shoes, repair" oninput="searchByKeyword()">
    </div>
    <div id="keywordResults" class="results"></div>
  </div>

  <!-- TAB 3: Custom Goods / Services Submission -->
  <div id="custom-item" class="tab-content">
    <div class="form-group">
      <label for="customGoods">Other Goods / Services (Not listed in database):</label>
      <textarea id="customGoods" rows="4" placeholder="Describe your custom goods or services here..."></textarea>
    </div>

    <!-- Mandatory Formality Check Notice -->
    <div class="notice-box">
      <strong>⚠️ Note:</strong> Submitting custom terms outside the standard list takes extra time for the formality check during application processing.
    </div>

    <div class="form-group" style="margin-top: 16px;">
      <button class="btn-submit" onclick="submitCustomTerms()">Submit Terms</button>
    </div>
    <div id="customStatus"></div>
  </div>
</div>

<script>
  let dataPool = {};

  // Fetch mgs.json from repository root
  fetch('mgs.json')
    .then(response => response.json())
    .then(data => {
      dataPool = data;
    })
    .catch(error => {
      console.error('Error loading mgs.json:', error);
    });

  function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

    document.getElementById(tabId).classList.add('active');
    event.target.classList.add('active');
  }

  // 1. Search by Class
  function searchByClass() {
    const classNum = document.getElementById('classNumber').value.trim();
    const resultsContainer = document.getElementById('classResults');
    resultsContainer.innerHTML = '';

    if (!classNum || !dataPool[classNum]) {
      resultsContainer.innerHTML = '<p style="color: var(--text-muted);">Please enter a valid class number (1-45).</p>';
      return;
    }

    const classData = dataPool[classNum];
    let html = `
      <div class="class-group">
        <div class="class-header">Class ${classNum}: ${classData.class_name} (${classData.items.length} items)</div>
        <ul class="item-list">
          ${classData.items.map(item => `<li class="item-tag">${item}</li>`).join('')}
        </ul>
      </div>
    `;
    resultsContainer.innerHTML = html;
  }

  // 2. Search by Keyword Across All Classes
  function searchByKeyword() {
    const keyword = document.getElementById('keywordInput').value.trim().toLowerCase();
    const resultsContainer = document.getElementById('keywordResults');
    resultsContainer.innerHTML = '';

    if (keyword.length < 2) {
      resultsContainer.innerHTML = '<p style="color: var(--text-muted);">Please enter at least 2 characters to search.</p>';
      return;
    }

    let foundResults = [];

    for (const [classNum, classObj] of Object.entries(dataPool)) {
      const matches = classObj.items.filter(item => item.toLowerCase().includes(keyword));
      if (matches.length > 0) {
        foundResults.push({
          classNum: classNum,
          className: classObj.class_name,
          items: matches
        });
      }
    }

    if (foundResults.length === 0) {
      resultsContainer.innerHTML = '<p>No matching goods or services found in the database. Please use the <strong>"Submit Custom Terms"</strong> tab.</p>';
      return;
    }

    let html = '';
    foundResults.forEach(res => {
      html += `
        <div class="class-group">
          <div class="class-header">Suggested Class ${res.classNum}: ${res.className} (${res.items.length} match${res.items.length > 1 ? 'es' : ''})</div>
          <ul class="item-list">
            ${res.items.map(item => `<li class="item-tag">${item}</li>`).join('')}
          </ul>
        </div>
      `;
    });

    resultsContainer.innerHTML = html;
  }

  // 3. Submit Custom Terms
  function submitCustomTerms() {
    const text = document.getElementById('customGoods').value.trim();
    const status = document.getElementById('customStatus');
    if (!text) {
      status.innerHTML = '<p style="color: red; margin-top: 10px;">Please enter goods or services before submitting.</p>';
      return;
    }
    status.innerHTML = '<p style="color: green; margin-top: 10px;">Custom terms submitted successfully!</p>';
  }
</script>

</body>
</html>
